name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Build package
        run: uv build

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  bitstream:
    name: Bitstream ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: env6_mini
            device: UP5K
            package: sg48
            extension: bin
            local_chipdb: false
          - board: arty7
            device: AMD
            package: xc7a100tcsg324-1
            extension: bit
            local_chipdb: true
          - board: env5
            device: AMD
            package: xc7s50ftgb196-1
            extension: bit
            local_chipdb: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Install the OSS CAD Suite with the devenv script (provides yosys)
        run: printf 'l\n' | devenv shell -- download_oss_cad

      - name: Prepare the project of the board
        run: uv run python .github/ci/prepare_bitstream_project.py ${{ matrix.board }} build_bitstream/${{ matrix.board }}

      - name: Cache the chip database
        if: matrix.local_chipdb
        uses: actions/cache@v4
        with:
          path: build_bitstream/${{ matrix.board }}/chipdb
          key: chipdb-${{ matrix.package }}-${{ hashFiles('elasticai/fpga_testing/template/oss_cad/config_verilog_amd.mk', 'devenv.lock') }}

      - name: Build the bitstream
        run: |
          CHIPDB_ARG=""
          if [ "${{ matrix.local_chipdb }}" = "true" ]; then
            CHIPDB_ARG="CHIPDB_DIR=$PWD/build_bitstream/${{ matrix.board }}/chipdb"
          fi
          devenv shell -- make -C build_bitstream/${{ matrix.board }} DEVICE=${{ matrix.device }} PACKAGE=${{ matrix.package }} $CHIPDB_ARG bitstream

      - name: Name the bitstream
        run: |
          mkdir -p dist_bitstream
          cp build_bitstream/${{ matrix.board }}/build/TOP_MODULE.${{ matrix.extension }} \
            dist_bitstream/bitstream-${{ matrix.board }}-${{ github.event.release.tag_name }}.${{ matrix.extension }}

      - name: Upload the bitstream to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_bitstream/*
